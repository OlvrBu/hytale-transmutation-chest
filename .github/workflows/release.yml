# Builds the mod jar for a version tag and publishes it as a GitHub Release.
#
# - Pushing a tag like v1.3.0 runs it automatically.
# - For tags made before this workflow existed: Actions tab -> "Release" -> "Run workflow",
#   and enter the tag (e.g. v1.2.1).
#
# The jar is built from the tag's code. The release notes are that version's section of
# CHANGELOG.md (taken from the commit this workflow runs from, so old tags get the current
# changelog). Running it again for the same tag replaces the jar.
name: Release
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.1"
        required: true
        type: string
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload the jar
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Check tag name
      run: |
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3, got '$TAG'"; exit 1; }
    - uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ env.TAG }}
        fetch-depth: 0   # all tags and the workflow's own commit (for CHANGELOG.md)
    - name: Check that the tag matches the mod version
      run: |
        VERSION=$(grep -oP '^version\s*=\s*\K\S+' gradle.properties)
        MOD_ID=$(grep -oP '^mod_id\s*=\s*\K\S+' gradle.properties)
        MOD_NAME=$(grep -oP '^mod_name\s*=\s*\K.*' gradle.properties)
        SERVER=$(grep -oP '^manifestServerVersion\s*=\s*\K.*' gradle.properties || true)
        [ "v$VERSION" = "$TAG" ] || { echo "::error::Tag $TAG but gradle.properties has version $VERSION"; exit 1; }
        { echo "VERSION=$VERSION"; echo "MOD_ID=$MOD_ID"; echo "MOD_NAME=$MOD_NAME"; echo "SERVER=$SERVER"; } >> "$GITHUB_ENV"
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew build
    - name: Write release notes
      run: |
        # This version's section of CHANGELOG.md: from "## <version>" up to the next "## ".
        git show "$GITHUB_SHA:CHANGELOG.md" 2>/dev/null \
          | awk -v v="$VERSION" '/^## /{p = ($2 == v)} p && !/^## /' > notes.md || true
        if ! grep -q '[^[:space:]]' notes.md; then echo "See CHANGELOG.md." > notes.md; fi
        if [ -n "$SERVER" ]; then printf '\nRequires a Hytale server `%s`. Put the jar in the server'"'"'s `mods/` folder (singleplayer: `UserData/Mods/`).\n' "$SERVER" >> notes.md; fi
        cat notes.md
    - name: Publish release
      run: |
        JAR="build/libs/$MOD_ID-$VERSION.jar"
        [ -f "$JAR" ] || { echo "::error::$JAR not found"; ls build/libs; exit 1; }
        # Only the highest version is marked "Latest", so releasing an old tag later doesn't take that label.
        NEWEST=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
        LATEST=$([ "$TAG" = "$NEWEST" ] && echo true || echo false)
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" "$JAR" --clobber
        else
          gh release create "$TAG" "$JAR" --title "$MOD_NAME $VERSION" --notes-file notes.md --latest="$LATEST" --verify-tag
        fi
